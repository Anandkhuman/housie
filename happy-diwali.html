<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Diwali ✨</title>
<style>
*{box-sizing:border-box} 
:root{--gold:#ffd36a;--orange:#ff8a25; --dark:#160d27}
body{margin:0;min-height:100vh;overflow-x:hidden;font-family:Georgia,serif;color:#fff7df;background:radial-gradient(ellipse at 50% 75%,#55200c 0%,#210b20 42%,#08091c 100%);display:grid;place-items:center}
.scene{position:relative;width:100%;height:100vh;display:flex;justify-content:center;align-items:center;perspective:1000px;isolation:isolate}
.stars,.fireworks{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:#fff4c6;border-radius:50%;box-shadow:0 0 9px #ffd36a;animation:twinkle 2s infinite alternate}
@keyframes twinkle{to{opacity:.2;transform:scale(.4)}}

/* Generator Form Styles */
.generator-box {position:relative; z-index: 10; width: min(92vw, 480px); max-height: 90vh; overflow-y: auto; padding: 30px 25px; background: rgba(20, 10, 30, 0.85); border-radius: 20px; border: 1px solid var(--gold); text-align: center; box-shadow: 0 0 35px rgba(255, 138, 37, 0.4); backdrop-filter: blur(12px);}
.generator-box::-webkit-scrollbar { width: 5px; }
.generator-box::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
.generator-box h2 { color: var(--gold); margin-top: 0; font-size: 24px; font-family: Arial, sans-serif; text-shadow: 0 0 10px var(--orange); }
.input-group { margin-bottom: 18px; text-align: left; }
.input-group label { display: block; margin-bottom: 6px; color: #ffe7b0; font-family: Arial, sans-serif; font-size: 14px;}
.input-group input[type="text"], .input-group input[type="number"], .input-group select, .input-group textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--gold); background: rgba(0,0,0,0.6); color: white; outline: none; font-size: 14px; font-family: Arial, sans-serif;}
.input-group textarea { resize: none; height: 70px; }
.input-group select option { background: var(--dark); color: white; }
.input-group input[type="file"] { padding: 10px; border: 1px dashed var(--gold); }
.input-group input[type="file"]::file-selector-button { background: linear-gradient(135deg,#ffca62,#e86a1b); border: none; padding: 6px 12px; border-radius: 5px; color: #38120a; font-weight: bold; cursor: pointer; margin-right: 15px;}

#share-section { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255, 211, 106, 0.3); }
#share-link { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #fff; color: #000; margin-bottom: 10px; font-size: 13px; font-family: Arial, sans-serif; resize: none; outline: none;}

/* Buttons */
button{padding:12px 20px;border:1px solid #ffdb8a;border-radius:30px;background:linear-gradient(135deg,#ffca62,#e86a1b);color:#38120a;font-weight:bold;font-size:14px;cursor:pointer;box-shadow:0 6px 22px #ff8a2555;transition:.25s; margin: 5px 2px;}
button:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 30px #ff8a2588}
.btn-wa { background: #25D366; color: white; border: 1px solid #128C7E; box-shadow: 0 6px 22px rgba(37, 211, 102, 0.4); }
.btn-wa:hover { background: #1ebd5a; box-shadow: 0 10px 30px rgba(37, 211, 102, 0.6); color: white;}
.btn-outline { background: transparent; color: var(--gold); border: 2px solid var(--gold); }
.btn-outline:hover { background: rgba(255, 211, 106, 0.15); color: #fff;}

/* Card Styles */
.card-wrapper { display: none; position:relative; z-index:2; width:min(92vw,500px); max-height: 95vh; overflow-y: auto; text-align:center; padding: 20px 0; }
.card-wrapper::-webkit-scrollbar { display: none; }
.card{position:relative; width: 100%; padding:45px 25px 35px; border:1px solid #f8c96a88;border-radius:28px;background:linear-gradient(145deg,#4c1b25ee,#160d27ff);box-shadow:0 25px 60px #0009,inset 0 0 35px #ffb52a20;transform-style:preserve-3d;animation:float 5s ease-in-out infinite;}
@keyframes float{0%,100%{transform:rotateX(2deg) rotateY(-2deg) translateY(0)}50%{transform:rotateX(-1deg) rotateY(2deg) translateY(-8px)}}

.user-photo-wrap { display: none; margin: -75px auto 15px; width: 120px; height: 120px; border-radius: 50%; padding: 5px; background: linear-gradient(135deg, var(--gold), var(--orange)); box-shadow: 0 10px 25px rgba(255, 138, 37, 0.7); position: relative; z-index: 5;}
.user-photo { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--dark); background: #000;}

h1{font-size:clamp(2.5rem,7vw,4.5rem);line-height:1;margin:15px 0 5px;color:var(--gold);text-shadow:0 0 12px #ffb52a,0 0 35px #ff6a00;letter-spacing:1px}
.wishes-name { font-size: clamp(1.4rem, 6vw, 2.2rem); color: #fff; text-shadow: 0 0 15px var(--orange), 0 0 5px #fff; margin: 10px 0 10px; font-family: Arial, sans-serif; font-weight: bold; text-transform: capitalize; letter-spacing: 1px;}
.sub{font-family:Arial,sans-serif;font-size:clamp(0.85rem,3vw,1rem);letter-spacing:3px;text-transform:uppercase;color:#ffe7b0}
.message{font-family:Arial,sans-serif;color:#ffe9d0;font-size:1rem;line-height:1.6;margin:15px auto 0;max-width:400px; padding: 0 10px; font-style: italic;}
.om{font-size:32px;color:#ffd36a;text-shadow:0 0 15px #ff8a25; margin-bottom: -15px; opacity: 0.8;}

.diya-wrap{height:100px;display:flex;justify-content:center;align-items:end;margin: 20px auto 15px;filter:drop-shadow(0 0 22px #ff8a25)}
.flame{position:absolute;bottom:78px;width:28px;height:50px;border-radius:50% 50% 45% 45%;background:radial-gradient(ellipse at 50% 70%,#fffbd0 0 12%,#ffd64b 30%,#ff7a16 65%,transparent 72%);transform-origin:bottom;animation:flicker .16s infinite alternate;filter:blur(.2px)}
@keyframes flicker{to{transform:rotate(5deg) scaleX(.82) scaleY(1.08)}}
.bowl{width:105px;height:42px;background:linear-gradient(#ffcf6b,#a83b12 45%,#55140b);border-radius:8px 8px 60px 60px;transform:rotateX(-12deg);box-shadow:inset 0 7px 9px #fff5a5,0 12px 15px #0008}
.bowl:after{content:"";position:absolute;left:8px;right:8px;top:4px;height:8px;border-radius:50%;background:#ffdf8c}

.footer{position:absolute;bottom:12px;font:11px Arial,sans-serif;letter-spacing:2px;color:#f9c77c99;text-align:center;width:100%}
.burst{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 8px 2px var(--c);animation:burst 1.2s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="stars" id="stars"></div>
  <div class="fireworks" id="fireworks"></div>

  <!-- 1. Generator Form -->
  <div class="generator-box" id="generatorBox">
    <h2>✨ Create Diwali Wishes ✨</h2>
    
    <div class="input-group">
      <label>Enter Receiver's Name * (Jisko wish bhejni hai)</label>
      <input type="text" id="userName" placeholder="E.g. Rahul Sharma" required>
    </div>

    <div class="input-group">
      <label>Receiver's WhatsApp No. * (10 Digits only)</label>
      <input type="number" id="userPhone" placeholder="9876543210" pattern="\d{10}" required>
      <small style="color: #bbb; font-size: 11px;">(Do not add +91)</small>
    </div>

    <div class="input-group">
      <label>Upload Receiver's Photo (Optional)</label>
      <input type="file" id="userPhoto" accept="image/*">
    </div>

    <div class="input-group">
      <label>Select a Wish Message</label>
      <select id="wishDropdown"></select>
    </div>

    <div class="input-group">
      <label>Or Type Custom Wish (Overrides Dropdown)</label>
      <textarea id="customWish" placeholder="Write your own special Diwali message here..."></textarea>
    </div>

    <button id="generateBtn" style="width: 100%; margin-top: 5px;">Save & Generate Link 🚀</button>

    <div id="share-section">
      <p style="color: var(--gold); font-size: 15px; margin-top: 0; font-weight: bold;">🎉 Your Link is Ready!</p>
      <textarea id="share-link" rows="5" readonly></textarea>
      
      <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 5px;">
        <button id="copyBtn">📋 Copy</button>
        <button id="shareWaBtn" class="btn-wa">💬 Share on WhatsApp</button>
        <button id="previewBtn" class="btn-outline">👁️ Preview</button>
      </div>
    </div>
  </div>

  <!-- 2. The Wishes Card -->
  <div class="card-wrapper" id="wishesCardWrapper">
      <main class="card" id="wishesCard">
        <div class="user-photo-wrap" id="displayPhotoWrap">
            <img src="" alt="User" class="user-photo" id="displayPhoto">
        </div>
        <div class="om">ॐ</div>
        <div class="sub" style="margin-top: 10px;">Wishing You A Very</div>
        <h1>Happy Diwali</h1>
        <!-- Dikhne me acha lagega: Happy Diwali Dear Rahul -->
        <div class="wishes-name" id="displayName"></div> 
        <div class="sub">✨ शुभ दीपावली ✨</div>
        <div class="diya-wrap"><div style="position:relative"><div class="flame"></div><div class="bowl"></div></div></div>
        
        <p class="message" id="displayMessage"></p>
        
        <div style="margin-top: 30px;">
            <button id="createOwnBtn" class="btn-outline">✨ Create Your Own</button>
        </div>
      </main>
  </div>
  
  <div class="footer">LIGHT • LOVE • PROSPERITY</div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  // FIREBASE CONFIGURATION
  const firebaseConfig = {
    apiKey: "AIzaSyBxtWgmOPaFY1tq1mHHYOC5IRtV_gIIFuQ",
    authDomain: "sinthahousiev5.firebaseapp.com",
    databaseURL: "https://sinthahousiev5-default-rtdb.firebaseio.com",
    projectId: "sinthahousiev5",
    storageBucket: "sinthahousiev5.firebasestorage.app",
    messagingSenderId: "847328700536",
    appId: "1:847328700536:web:180eba328bcd5e6485258d",
    measurementId: "G-L6CPQFGSRH"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // 50+ DIWALI WISHES LIST
  const wishesList = [
    "May the supreme light illumine your minds, enlighten your hearts, and strengthen the human bonds in your homes and communities.",
    "Wishing you a Happy Diwali filled with joy, prosperity, and endless blessings!",
    "May the beauty of Deepawali fill your home with happiness, and may the coming year provide you with everything that brings you joy!",
    "Let’s celebrate the festival in the true sense by spreading joy and light up the world of others. Have a happy, safe, and blessed Diwali!",
    "May the warmth and splendor, that are a part of this auspicious occasion, fill your life with happiness and bright cheer.",
    "Wishing you and your family a beautiful and blessed Diwali!",
    "May millions of lamps illuminate your life with endless joy, prosperity, health and wealth forever.",
    "A festival full of sweet childhood memories, a sky full of fireworks, mouth full of sweets. Happy Diwali!",
    "May the goddess of wealth shower you with riches and endless happiness. Happy Diwali!",
    "Light a lamp of love, blast a chain of sorrow, shoot a rocket of prosperity, fire a flowerpot of happiness. Wish you sparkling Diwali.",
    "Let each diya you light bring a glow of happiness on your face and enlighten your soul. Happy Diwali!",
    "May this Diwali mark the beginning of a joyous and prosperous year for you.",
    "Wishing you a gleam of diyas, echo of holy chants, contentment and happiness today, tomorrow and forever. Happy Diwali!",
    "May the divine light of Diwali spread into your life peace, prosperity, happiness and good health.",
    "Shine like sparkles, glow like candles and burn all the negativity like crackles. Wish you a happy and cheerful Diwali!",
    "Let’s make this Diwali joyous and bright, Let’s celebrate in true sense this festival of light.",
    "May you get prosperity and wealth! Happy Diwali to you and your family.",
    "Wishing you the happiest and most blessed Diwali!",
    "May your life be as colorful, magnificent shimmering and magical as the lights from the lamps of Diwali.",
    "May every aspect of your life become as luminous and exciting as the lights flickering on the lamps in the festival of lights.",
    "Happy Diwali! May this festival of light brighten up your life.",
    "Have a safe and happy Diwali! May your home be filled with light and love.",
    "I hope you have a blessed, healthy and prosperous Diwali. A very happy Diwali to you!",
    "May this Diwali bring cheer and happiness into your life and life of your loved ones!",
    "May the light of diyas fill your home with wealth, happiness, and everything that brings you joy! Happy Diwali!",
    "With gleam of Diyas and the Echo of the Chants, May Happiness and Contentment Fill Your life.",
    "May the festival of lights add sparkles of joy to your life. Wishing you a happy Diwali!",
    "Let the lights of Diwali guide you on the path of success and happiness. Happy Diwali!",
    "May Goddess Lakshmi bless you with wealth and success. Happy Diwali!",
    "Wishing you a deeply joyful Diwali. May it bring peace and prosperity to you and your family.",
    "May your dreams come true and you find all the happiness of the world. Happy Diwali!",
    "Open your doors to the goddess of wealth and happiness. Wishing you a very Happy Diwali!",
    "Let’s celebrate the victory of light over darkness. Happy Diwali to you!",
    "I pray that this Diwali brings you all the happiness and prosperity in the world.",
    "Sending you warm wishes and bright light this Diwali!",
    "May your home be blessed with love, light, and prosperity. Happy Diwali!",
    "Wishing you a vibrant, joyous, and prosperous Diwali!",
    "Light the diyas and let your sorrows burn away. Happy Diwali!",
    "May this Deepawali bring happiness, peace, and prosperity to your life.",
    "May the glow of the diyas light your path towards progress and continuous success.",
    "May the sweetness of sweets and the light of diyas fill your life with boundless joy.",
    "Wishing a year full of smiles, good health, and success. Happy Diwali!",
    "May your heart be filled with love and your life with laughter. Happy Deepawali!",
    "This Diwali, may your life shine like a sparkling diya.",
    "Enjoy the festive spirit and the divine light of Diwali. Happy Diwali!",
    "May your life be as bright as the lights of Diwali.",
    "Hope your Diwali is lit with the smiles of your loved ones. Happy Diwali!",
    "May all your dark times end with the arrival of the festival of lights.",
    "Celebrate this Diwali with joy, love, and endless sweet moments.",
    "Wishing you endless happiness and abundant blessings this Diwali!",
    "May the divine glow of Deepawali stay in your heart forever.",
    "Sending you good vibes, positive energy, and sparkling wishes for Diwali!"
  ];

  const dropdown = document.getElementById("wishDropdown");
  wishesList.forEach(wish => {
    let option = document.createElement("option");
    option.value = wish;
    option.text = wish;
    dropdown.appendChild(option);
  });

  // ---------- ANIMATION ----------
  const stars=document.getElementById('stars'),fx=document.getElementById('fireworks');
  for(let i=0;i<90;i++){let s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';s.style.opacity=.3+Math.random()*.7;stars.appendChild(s)}

  function burst(x,y){
      const colors=['#ffd76a','#ff7a28','#fff2bd','#ff4d75','#8eeaff', '#4dff75'];
      for(let i=0;i<55;i++){
          let a=Math.PI*2*i/55, d=60+Math.random()*120, b=document.createElement('i');
          b.className='burst';
          b.style.left=x+'px'; b.style.top=y+'px';
          b.style.setProperty('--x',Math.cos(a)*d+'px');
          b.style.setProperty('--y',Math.sin(a)*d+'px');
          b.style.setProperty('--c',colors[i%colors.length]);
          fx.appendChild(b);
          setTimeout(()=>b.remove(),1300);
      }
  }

  function randomBurst(){burst(Math.random()*innerWidth, Math.random()*innerHeight*0.7)}
  setInterval(()=>{if(Math.random()>.4)randomBurst()},1500);

  function startInitialFireworks() {
      let count = 0;
      let burstInterval = setInterval(() => {
          randomBurst();
          count++;
          if(count >= 12) clearInterval(burstInterval);
      }, 250);
  }

  // ---------- IMAGE COMPRESSION ----------
  let compressedImageBase64 = "";
  document.getElementById('userPhoto').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
          const img = new Image();
          img.onload = function() {
              const canvas = document.createElement('canvas');
              const MAX_SIZE = 256; 
              let w = img.width, h = img.height;
              let minSize = Math.min(w, h);
              let sx = (w - minSize) / 2;
              let sy = (h - minSize) / 2;
              canvas.width = MAX_SIZE; canvas.height = MAX_SIZE;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, sx, sy, minSize, minSize, 0, 0, MAX_SIZE, MAX_SIZE);
              compressedImageBase64 = canvas.toDataURL('image/jpeg', 0.6);
          }
          img.src = event.target.result;
      }
      reader.readAsDataURL(file);
  });

  let generatedUrl = "";
  let targetPhone = "";

  // ---------- GENERATE & SAVE (WITH UNIQUE NAME LOGIC) ----------
  document.getElementById('generateBtn').addEventListener('click', async function() {
      const name = document.getElementById('userName').value.trim();
      const phone = document.getElementById('userPhone').value.trim();
      const customWish = document.getElementById('customWish').value.trim();
      const selectedWish = document.getElementById('wishDropdown').value;

      if(!name) { alert("Please enter the receiver's name!"); return; }
      if(!/^\d{10}$/.test(phone)) { alert("Please enter exactly 10 digits for WhatsApp number (No +91 needed)."); return; }
      
      const finalWish = customWish !== "" ? customWish : selectedWish;
      this.innerText = "Checking Name... ⏳";
      this.disabled = true;

      try {
          const dbRef = ref(db);
          let baseFormattedName = encodeURIComponent(name.replace(/\s+/g, '-'));
          let finalFormattedName = baseFormattedName;
          let counter = 1;

          while (true) {
              const snapshot = await get(child(dbRef, `wishes/${finalFormattedName}`));
              if (!snapshot.exists()) {
                  break; 
              }
              finalFormattedName = `${baseFormattedName}-${counter}`;
              counter++;
          }

          this.innerText = "Saving Data... ⏳";

          const userRef = ref(db, 'wishes/' + finalFormattedName);
          await set(userRef, {
              name: name,
              phone: phone,
              message: finalWish,
              photo: compressedImageBase64,
              timestamp: new Date().toISOString()
          });

          generatedUrl = window.location.href.split('?')[0] + '?name=' + finalFormattedName;
          targetPhone = phone;
          
          // PRE-FILLED WHATSAPP MESSAGE UPDATED (For the Receiver)
          const shareMessage = `✨ Dear *${name}*, I have created a special Happy Diwali surprise for you! 🪔🎆\n\nClick the link below to open your wish 👇\n\n${generatedUrl}`;
          
          document.getElementById('share-link').value = shareMessage;
          document.getElementById('share-section').style.display = 'block';
          
          this.innerText = "Save & Generate Link 🚀";
          this.disabled = false;

      } catch (error) {
          console.error("Error saving to Firebase:", error);
          alert("Something went wrong. Check console.");
          this.innerText = "Save & Generate Link 🚀";
          this.disabled = false;
      }
  });

  // ---------- SHARE BUTTONS ----------
  document.getElementById('copyBtn').addEventListener('click', function() {
      const linkInput = document.getElementById('share-link');
      linkInput.select();
      document.execCommand('copy');
      const originalText = this.innerText;
      this.innerText = "✔ Copied!";
      setTimeout(() => this.innerText = originalText, 2000);
  });

  document.getElementById('shareWaBtn').addEventListener('click', function() {
      const textToShare = encodeURIComponent(document.getElementById('share-link').value);
      window.open(`https://api.whatsapp.com/send?phone=91${targetPhone}&text=${textToShare}`, '_blank');
  });

  document.getElementById('previewBtn').addEventListener('click', function() {
      window.location.href = generatedUrl;
  });

  document.getElementById('createOwnBtn').addEventListener('click', function() {
      window.location.href = window.location.href.split('?')[0];
  });

  // ---------- ON PAGE LOAD: FETCH WISH BY NAME ----------
  window.onload = async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlName = urlParams.get('name'); 
      
      if(urlName) {
          document.getElementById('generatorBox').style.display = 'none';
          
          try {
              const dbRef = ref(db);
              const snapshot = await get(child(dbRef, `wishes/${urlName}`));
              
              if (snapshot.exists()) {
                  const data = snapshot.val();
                  
                  document.getElementById('wishesCardWrapper').style.display = 'block';
                  
                  // NAME FORMAT UPDATED FOR RECEIVER ("Dear Rahul")
                  document.getElementById('displayName').innerText = "Dear " + data.name;
                  document.getElementById('displayMessage').innerText = data.message;
                  
                  if(data.photo) {
                      document.getElementById('displayPhoto').src = data.photo;
                      document.getElementById('displayPhotoWrap').style.display = 'block';
                      document.getElementById('wishesCard').style.marginTop = '40px'; 
                  }
                  
              } else {
                  let decodedName = decodeURIComponent(urlName).replace(/-/g, ' ');
                  decodedName = decodedName.replace(/\s\d+$/, ''); 
                  
                  document.getElementById('wishesCardWrapper').style.display = 'block';
                  // FALLBACK NAME FORMAT
                  document.getElementById('displayName').innerText = "Dear " + decodedName;
                  document.getElementById('displayMessage').innerText = "May the supreme light illumine your minds, enlighten your hearts, and strengthen the human bonds in your homes and communities. Happy Diwali!";
              }
              
              setTimeout(startInitialFireworks, 300);

          } catch (error) {
              console.error(error);
          }
      }
  };
</script>
</body>
</html>
